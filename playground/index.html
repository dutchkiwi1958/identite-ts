<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>MRZ Passport Scanner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin: 10px 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    #zone {
      background: white;
      border: 2px dashed #999;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    #zone.actif {
      border-color: #0d6efd;
      background: #eef5ff;
    }

    .camera-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .scan-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .scan-help {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    #fichier {
      display: none;
    }

    #statut {
      margin-top: 20px;
      padding: 12px;
      background: white;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    #apercu {
      display: none;
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      background: white;
    }

    .result-card {
      margin-top: 20px;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .result-card h2 {
      margin-top: 0;
      text-align: center;
      color: #198754;
    }

    #resultat {
      margin: 0;
      white-space: pre-wrap;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 8px;
      padding: 14px;
      font-size: 16px;
      cursor: pointer;
    }

    #scan-again {
      background: #6c757d;
      color: white;
    }

    #use-data {
      background: #198754;
      color: white;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 23px;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>MRZ Passport Scanner</h1>

  <div class="subtitle">
    Scan or photograph the passport information page
  </div>

  <div id="zone">

    <div class="camera-icon">📷</div>

    <div class="scan-title">
      Scan Passport
    </div>

    <div class="scan-help">
      Tap here to take a photo or select a passport image.
      <br><br>
      Make sure the complete passport page and MRZ lines are visible.
    </div>

  </div>

  <input
    id="fichier"
    type="file"
    accept="image/*"
  >

  <p id="statut">
    Ready to scan
  </p>

  <img
    id="apercu"
    alt="Passport preview"
  >

  <div class="result-card">

    <h2>Passport Details</h2>

    <pre id="resultat">
No passport scanned.
    </pre>

    <div class="buttons">

      <button
        type="button"
        id="scan-again"
      >
        Scan Again
      </button>

      <button
        type="button"
        id="use-data"
      >
        Use Passport Data
      </button>

    </div>

  </div>

</div>


<!--
These elements are retained because the original
playground TypeScript may still reference them.
They are hidden from the user.
-->

<div id="diagnostic" style="display:none;">
  <pre id="diagnostic-contenu"></pre>
</div>

<div id="rapport" style="display:none;">
  <pre id="rapport-contenu"></pre>
  <button id="rapport-copier" type="button">
    Copy
  </button>
</div>

<div id="vignettes" style="display:none;">
  <div id="vignettes-contenu"></div>
</div>


<script type="module" src="/src/main.ts"></script>


<script>
  document
    .getElementById('scan-again')
    .addEventListener('click', function () {

      document.getElementById('fichier').value = '';

      document.getElementById('resultat').textContent =
        'No passport scanned.';

      document.getElementById('statut').textContent =
        'Ready to scan';

      document.getElementById('apercu').style.display =
        'none';

      document.getElementById('fichier').click();

    });


  document
    .getElementById('use-data')
    .addEventListener('click', function () {

      alert(
        'Passport data connection to Booking will be added next.'
      );

    });
</script>

</body>
</html>
